<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CineData Explorer</title>
    <link
      rel="icon"
      href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎬</text></svg>"
    />
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <main>
      <header>
        <div class="icon">
          <svg
            xmlns="http://www.w3.org/2000/svg"
            fill="none"
            viewBox="0 0 24 24"
            stroke-width="1.5"
            stroke="currentColor"
            class="size-6"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              d="M3.375 19.5h17.25m-17.25 0a1.125 1.125 0 0 1-1.125-1.125M3.375 19.5h1.5C5.496 19.5 6 18.996 6 18.375m-3.75 0V5.625m0 12.75v-1.5c0-.621.504-1.125 1.125-1.125m18.375 2.625V5.625m0 12.75c0 .621-.504 1.125-1.125 1.125m1.125-1.125v-1.5c0-.621-.504-1.125-1.125-1.125m0 3.75h-1.5A1.125 1.125 0 0 1 18 18.375M20.625 4.5H3.375m17.25 0c.621 0 1.125.504 1.125 1.125M20.625 4.5h-1.5C18.504 4.5 18 5.004 18 5.625m3.75 0v1.5c0 .621-.504 1.125-1.125 1.125M3.375 4.5c-.621 0-1.125.504-1.125 1.125M3.375 4.5h1.5C5.496 4.5 6 5.004 6 5.625m-3.75 0v1.5c0 .621.504 1.125 1.125 1.125m0 0h1.5m-1.5 0c-.621 0-1.125.504-1.125 1.125v1.5c0 .621.504 1.125 1.125 1.125m1.5-3.75C5.496 8.25 6 7.746 6 7.125v-1.5M4.875 8.25C5.496 8.25 6 8.754 6 9.375v1.5m0-5.25v5.25m0-5.25C6 5.004 6.504 4.5 7.125 4.5h9.75c.621 0 1.125.504 1.125 1.125m1.125 2.625h1.5m-1.5 0A1.125 1.125 0 0 1 18 7.125v-1.5m1.125 2.625c-.621 0-1.125.504-1.125 1.125v1.5m2.625-2.625c.621 0 1.125.504 1.125 1.125v1.5c0 .621-.504 1.125-1.125 1.125M18 5.625v5.25M7.125 12h9.75m-9.75 0A1.125 1.125 0 0 1 6 10.875M7.125 12C6.504 12 6 12.504 6 13.125m0-2.25C6 11.496 5.496 12 4.875 12M18 10.875c0 .621-.504 1.125-1.125 1.125M18 10.875c0 .621.504 1.125 1.125 1.125m-2.25 0c.621 0 1.125.504 1.125 1.125m-12 5.25v-5.25m0 5.25c0 .621.504 1.125 1.125 1.125h9.75c.621 0 1.125-.504 1.125-1.125m-12 0v-1.5c0-.621-.504-1.125-1.125-1.125M18 18.375v-5.25m0 5.25v-1.5c0-.621.504-1.125 1.125-1.125M18 13.125v1.5c0 .621.504 1.125 1.125 1.125M18 13.125c0-.621.504-1.125 1.125-1.125M6 13.125v1.5c0 .621-.504 1.125-1.125 1.125M6 13.125C6 12.504 5.496 12 4.875 12m-1.5 0h1.5m-1.5 0c-.621 0-1.125.504-1.125 1.125v1.5c0 .621.504 1.125 1.125 1.125M19.125 12h1.5m0 0c.621 0 1.125.504 1.125 1.125v1.5c0 .621-.504 1.125-1.125 1.125m-17.25 0h1.5m14.25 0h1.5"
            />
          </svg>

          <div>CineData</div>
        </div>
        <div class="temaWrap">
          <button
            class="themeButton"
            id="themeBtn"
            type="button"
            aria-label="Temas"
            aria-expanded="false"
            aria-controls="temasPanel"
          >
            <span class="swatch" aria-hidden="true"></span>
          </button>
          <div class="temas" id="temasPanel" hidden>
            <button
              type="button"
              class="temaOpt"
              data-theme="claro"
              aria-pressed="true"
            >
              <span
                class="swatch"
                style="--s-bg: #f7f7f5; --s-ac: #2f6fed"
                aria-hidden="true"
              ></span>
              <span class="temaName">Claro</span>
              <svg
                class="check"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2.5"
                stroke-linecap="round"
                stroke-linejoin="round"
                aria-hidden="true"
              >
                <path d="M5 12l5 5L20 7" />
              </svg>
            </button>

            <button
              type="button"
              class="temaOpt"
              data-theme="oscuro"
              aria-pressed="false"
            >
              <span
                class="swatch"
                style="--s-bg: #14161a; --s-ac: #5b9dff"
                aria-hidden="true"
              ></span>
              <span class="temaName">Oscuro</span>
              <svg
                class="check"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2.5"
                stroke-linecap="round"
                stroke-linejoin="round"
                aria-hidden="true"
              >
                <path d="M5 12l5 5L20 7" />
              </svg>
            </button>

            <button
              type="button"
              class="temaOpt"
              data-theme="cine"
              aria-pressed="false"
            >
              <span
                class="swatch"
                style="--s-bg: #1a1214; --s-ac: #e0b04a"
                aria-hidden="true"
              ></span>
              <span class="temaName">Cine</span>
              <svg
                class="check"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2.5"
                stroke-linecap="round"
                stroke-linejoin="round"
                aria-hidden="true"
              >
                <path d="M5 12l5 5L20 7" />
              </svg>
            </button>

            <button
              type="button"
              class="temaOpt"
              data-theme="bosque"
              aria-pressed="false"
            >
              <span
                class="swatch"
                style="--s-bg: #eef6f6; --s-ac: #0b7a7a"
                aria-hidden="true"
              ></span>
              <span class="temaName">Bosque</span>
              <svg
                class="check"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2.5"
                stroke-linecap="round"
                stroke-linejoin="round"
                aria-hidden="true"
              >
                <path d="M5 12l5 5L20 7" />
              </svg>
            </button>
          </div>
        </div>
      </header>

      <div class="searchFilter">
        <input
          class="searchBar"
          type="search"
          placeholder="Busca una pelicula..."
        />
        <div class="filtersOrder">
          <button
            class="filterButton"
            id="filterBtn"
            type="button"
            aria-label="Filtros"
            aria-expanded="false"
            aria-controls="filterPanel"
          >
            <svg
              xmlns="http://www.w3.org/2000/svg"
              fill="none"
              viewBox="0 0 24 24"
              stroke-width="1.5"
              stroke="currentColor"
              class="size-6"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                d="M10.5 6h9.75M10.5 6a1.5 1.5 0 1 1-3 0m3 0a1.5 1.5 0 1 0-3 0M3.75 6H7.5m3 12h9.75m-9.75 0a1.5 1.5 0 0 1-3 0m3 0a1.5 1.5 0 0 0-3 0m-3.75 0H7.5m9-6h3.75m-3.75 0a1.5 1.5 0 0 1-3 0m3 0a1.5 1.5 0 0 0-3 0m-9.75 0h9.75"
              />
            </svg>
          </button>
        </div>
      </div>

      <section class="panel" id="filterPanel" hidden>
        <div class="field">
          <span class="label">Género</span>
          <div class="chips" id="genreChips">
            <button
              type="button"
              class="chip"
              data-genre=""
              aria-pressed="true"
            >
              Todos
            </button>
            <button
              type="button"
              class="chip"
              data-genre="18"
              aria-pressed="false"
            >
              Drama
            </button>
            <button
              type="button"
              class="chip"
              data-genre="28"
              aria-pressed="false"
            >
              Acción
            </button>
            <button
              type="button"
              class="chip"
              data-genre="35"
              aria-pressed="false"
            >
              Comedia
            </button>
            <button
              type="button"
              class="chip"
              data-genre="27"
              aria-pressed="false"
            >
              Terror
            </button>
          </div>
        </div>

        <label class="field">
          <span class="label">Año</span>
          <select id="yearSelect">
            <option value="">Todos</option>
          </select>
        </label>

        <label class="field">
          <span class="label">Rating mínimo</span>
          <select id="ratingSelect">
            <option value="0">Todos</option>
            <option value="5">5+</option>
            <option value="7">7+</option>
            <option value="9">9+</option>
          </select>
        </label>

        <label class="field">
          <span class="label">Ordenar por</span>
          <select id="sortSelect">
            <option value="popularity">Popularidad</option>
            <option value="rating">Rating</option>
            <option value="year">Año</option>
            <option value="title">Título</option>
          </select>
        </label>

        <div class="actions">
          <button type="button" class="btn ghost" id="clearBtn">Limpiar</button>
          <button type="button" class="btn" id="closeBtn">
            Ver resultados
          </button>
        </div>
      </section>
      <section class="destacadas" aria-labelledby="destacadasTitulo">
        <h2 id="destacadasTitulo">Tendencias de la semana</h2>
        <ul class="carrusel" id="carrusel"></ul>
      </section>
      <section class="rejilla" id="rejilla"></section>
    </main>
  </body>

  <script type="module" src="js/main.js"></script>
</html>
